[project]
name = "rsi"
version = "0.1.0"
description = "Evolve local models on swappable agent harnesses and benchmarks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0.0",
    "docker>=7.2.0",
    "huggingface-hub>=0.30.0",
    "pydantic>=2.13.5",
    "swebench>=5.0.2",
    "typer>=0.27.2",
]

[project.scripts]
rsi = "rsi.cli:app"

[dependency-groups]
# ruff 0.16, like jym/ and training/
dev = ["pytest>=8.3.0", "ruff>=0.11.0,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
# generated by the teacher, and never edited once run
extend-exclude = ["variants"]

[tool.ruff.lint]
extend-select = ["E501", "I"]
