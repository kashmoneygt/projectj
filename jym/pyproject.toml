[project]
name = "jym"
version = "1.0.0"
description = "A platform to test AI models in various environments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.30.0",
    "jsbsim>=1.2.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "typer>=0.27.2",
    "typesafe-sdk==0.7.1",
    "uvicorn>=0.34.0",
    "websockets>=15.0",
]

[project.scripts]
jym = "jym.cli:app"

[project.entry-points."jym.environments"]
flight = "jym.environments.flight.spec:SPEC"

[project.optional-dependencies]
laya = ["laya==0.3.6"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
extend-select = ["E501", "I"]
