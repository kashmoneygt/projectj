[project]
name = "training"
version = "1.0.0"
description = "Train models to take actions in jym environments"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30.0",
    "jym",
    "peft>=0.17.0",
    "torch>=2.8.0",
    "transformers>=4.57.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.11.0"]

[tool.uv]
package = false

[tool.uv.sources]
jym = { path = "../jym", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["flight_controller", "jym"]
